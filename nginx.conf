server {
    listen 1010;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 只按文件匹配，不要写成 $uri $uri/：Vite 产物目录 dist/assets 与应用路由 /assets
        # （用户资产中心）同名，目录匹配会把 /assets 301 到 /assets/ 再由静态目录返回 403。
        try_files $uri /index.html;
    }

    # 目录形式的 /assets/ 同样交给前端路由，避免命中静态产物目录。
    location = /assets/ {
        try_files /index.html =404;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
